{% extends "base.html" %}

{% block content %}
    <header class="page-header">
      <h1>HTML Reports</h1>
      <div class="header-actions">
        {% if reports %}<p class="count">보고서 {{ reports|length }}개</p>{% endif %}
        <a class="header-link" href="{{ root_path }}/settings">설정</a>
      </div>
    </header>

    <section class="card">
      {% if reports %}
      <table class="reports">
        <thead>
          <tr>
            <th scope="col">파일 이름</th>
            <th scope="col" class="date">업로드 날짜</th>
          </tr>
        </thead>
        <tbody>
          {% for report in reports %}
          <tr>
            <td class="name"><a href="{{ report.href }}">{{ report.name }}</a></td>
            <td class="date"><time datetime="{{ report.uploaded_at_iso }}">{{ report.uploaded_at }}</time></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      {% else %}
      <p class="empty">업로드된 보고서가 없습니다</p>
      {% endif %}
    </section>
{% endblock %}
